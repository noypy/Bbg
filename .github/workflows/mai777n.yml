name: Windows RDP via SSH Tunnel

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"

concurrency:
  group: rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve inputs
        id: cfg
        env:
          RAW_TEST:     ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME:  ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:    ${{ inputs.loops || '0' }}
          RAW_PAT:      ${{ secrets.GITHUB_TOKEN }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }
          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }
          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Resolved: test=$isTest, runtime=$runtime, loops=$loops"

      - name: 🔐 Enable RDP user + firewall
        run: |
          $u="${{ env.RDP_USER }}"; $p="${{ env.RDP_PASS }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Write-Host "✅ RDP enabled for $u"

      - name: 🌍 Public IP (info only)
        id: pubip
        run: |
          $ip = $null
          try { $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json" -TimeoutSec 10).ip } catch {}
          if (-not $ip) { try { $ip = (Invoke-RestMethod -Uri "https://ifconfig.me/ip" -TimeoutSec 10) } catch {} }
          if (-not $ip) { $ip = "unknown" }
          "ip=$ip" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Public IP: $ip"
          "### 🌍 Runner Public IP`n**IP:** ``$ip```n> ⚠️ Inbound 3389 blocked — use tunnel endpoint." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ═══════════════════════════════════════════════════════════════
      # 🌐 SSH tunnel: Pinggy → serveo → localhost.run (all built-in ssh.exe)
      # ═══════════════════════════════════════════════════════════════
      - name: 🌐 Start SSH tunnel (multi-provider fallback)
        id: tunnel
        run: |
          $knownHosts = "$env:TEMP\known_hosts"
          $endpoint = $null
          $provider = $null
          $proc = $null

          function Try-Provider {
            param(
              [string]$Name,
              [string[]]$SshArgs,
              [string]$RegexPattern,
              [int]$TimeoutSec = 45
            )
            Write-Host "Trying provider: $Name..."
            $so = "$env:TEMP\$Name.out"; $se = "$env:TEMP\$Name.err"
            Remove-Item $so,$se -ErrorAction SilentlyContinue

            $p = Start-Process -FilePath "ssh.exe" -ArgumentList $SshArgs `
              -RedirectStandardOutput $so -RedirectStandardError $se `
              -PassThru -WindowStyle Hidden

            $deadline = (Get-Date).AddSeconds($TimeoutSec)
            $found = $null
            while ((Get-Date) -lt $deadline -and -not $found) {
              Start-Sleep -Seconds 2
              if ($p.HasExited -and -not $found) { Start-Sleep -Seconds 1 }
              foreach ($f in @($so,$se)) {
                if (Test-Path $f) {
                  $c = Get-Content $f -Raw -ErrorAction SilentlyContinue
                  if ($c -match $RegexPattern) { $found = $Matches[1] }
                  if ($found) { break }
                }
              }
            }

            if ($found) {
              Write-Host "✅ $Name endpoint: $found (PID $($p.Id))"
              return @{ Name=$Name; Endpoint=$found; Pid=$p.Id; Success=$true }
            } else {
              Write-Warning "$Name failed"
              Get-Content $se -ErrorAction SilentlyContinue | Select-Object -First 5 | Write-Host
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              return @{ Success=$false }
            }
          }

          # ── Provider 1: Pinggy (most reliable) ──
          $r = Try-Provider -Name "pinggy" -RegexPattern 'tcp://([^\s]+:\d+)' -SshArgs @(
            '-p','443','-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",
            '-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes',
            '-R','0:127.0.0.1:3389','tcp@free.pinggy.io'
          )
          if ($r.Success) { $endpoint=$r.Endpoint; $provider=$r.Name; $proc=$r.Pid }

          # ── Provider 2: serveo.net ──
          if (-not $endpoint) {
            $r = Try-Provider -Name "serveo" -RegexPattern 'serveo\.net:(\d+)' -SshArgs @(
              '-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",
              '-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes',
              '-N','-R','0:localhost:3389','serveo.net'
            )
            if ($r.Success) { $endpoint = "serveo.net:$($r.Endpoint)"; $provider=$r.Name; $proc=$r.Pid }
          }

          # ── Provider 3: localhost.run ──
          if (-not $endpoint) {
            $r = Try-Provider -Name "lhr" -RegexPattern '([a-z0-9]+\.lhr\.life:\d+)' -SshArgs @(
              '-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",
              '-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes',
              '-R','0:localhost:3389','nokey@localhost.run'
            )
            if ($r.Success) { $endpoint = $r.Endpoint; $provider=$r.Name; $proc=$r.Pid }
          }

          if (-not $endpoint) { throw "All SSH tunnel providers failed" }

          "endpoint=$endpoint"     | Out-File -Append $env:GITHUB_OUTPUT
          "provider=$provider"     | Out-File -Append $env:GITHUB_OUTPUT
          "tunnel_pid=$proc"       | Out-File -Append $env:GITHUB_OUTPUT

          @"
          ### 🌐 Public RDP — READY
          **Provider:** ``$provider``
          **Endpoint:** ``$endpoint``  →  mstsc Computer = ``$endpoint``
          **User:** ``$env:RDP_USER``
          **Pass:** ``$env:RDP_PASS``

          > Pinggy free tier ≈ 60 min — auto-restart loop will renew endpoint.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Keep alive (with tunnel auto-restart)
        run: |
          $mins=[int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins)
          $tpid = "${{ steps.tunnel.outputs.tunnel_pid }}"
          $provider = "${{ steps.tunnel.outputs.provider }}"
          $currentEndpoint = "${{ steps.tunnel.outputs.endpoint }}"
          $lastRestart = Get-Date
          $knownHosts = "$env:TEMP\known_hosts"

          function Restart-Tunnel {
            param([string]$Provider)
            Write-Host "Restarting tunnel ($Provider)..."
            $so = "$env:TEMP\restart.out"; $se = "$env:TEMP\restart.err"
            Remove-Item $so,$se -ErrorAction SilentlyContinue
            $args = switch ($Provider) {
              "pinggy" { @('-p','443','-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",'-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes','-R','0:127.0.0.1:3389','tcp@free.pinggy.io') }
              "serveo" { @('-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",'-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes','-N','-R','0:localhost:3389','serveo.net') }
              "lhr"    { @('-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$knownHosts",'-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes','-R','0:localhost:3389','nokey@localhost.run') }
            }
            $p = Start-Process -FilePath "ssh.exe" -ArgumentList $args `
              -RedirectStandardOutput $so -RedirectStandardError $se -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 12
            $ep = $null
            foreach ($f in @($so,$se)) {
              if (Test-Path $f) {
                $c = Get-Content $f -Raw -ErrorAction SilentlyContinue
                if ($c -match 'tcp://([^\s]+:\d+)')            { $ep = $Matches[1] }
                elseif ($c -match 'serveo\.net:(\d+)')          { $ep = "serveo.net:$($Matches[1])" }
                elseif ($c -match '([a-z0-9]+\.lhr\.life:\d+)') { $ep = $Matches[1] }
              }
            }
            return @{ Pid = $p.Id; Endpoint = $ep }
          }

          while((Get-Date) -lt $end){
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            $proc = Get-Process -Id $tpid -ErrorAction SilentlyContinue

            if (-not $proc) {
              Write-Warning "Tunnel died — restarting..."
              $r = Restart-Tunnel -Provider $provider
              $tpid = $r.Pid
              if ($r.Endpoint) { $currentEndpoint = $r.Endpoint }
              $lastRestart = Get-Date
              @"
              ### 🔄 Tunnel restarted
              **Endpoint:** ``$currentEndpoint``
              **User:** ``$env:RDP_USER``  **Pass:** ``$env:RDP_PASS``
              "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            # Proactive rotation for Pinggy (free tier 60-min limit)
            if ($provider -eq "pinggy" -and ((Get-Date) - $lastRestart).TotalMinutes -ge 55) {
              Write-Host "Pinggy 55-min rotation..."
              Stop-Process -Id $tpid -Force -ErrorAction SilentlyContinue
              $lastRestart = Get-Date
              continue
            }

            Write-Host "alive... $left min | endpoint: $currentEndpoint | pid: $tpid"
            Start-Sleep -Seconds 60
          }

      - name: 🛑 Kill tunnel
        if: always()
        run: |
          $tpid = "${{ steps.tunnel.outputs.tunnel_pid }}"
          if ($tpid -and $tpid -ne '') { Stop-Process -Id $tpid -Force -ErrorAction SilentlyContinue }
          Get-Process ssh -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: 🔁 Self-dispatch (loop)
        if: always()
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          $loops=[int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "Loops finished."; exit 0 }
          if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }
          $token = $env:PAT
          if (-not $token) { Write-Host "No GH_PAT secret — skipping dispatch"; exit 0 }
          $body=@{
            ref    = "${{ github.ref_name }}"
            inputs = @{
              test_mode       = "false"
              runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
              loops           = "$next"
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-A.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
