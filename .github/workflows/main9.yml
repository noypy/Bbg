name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        required: true
      ts_api_key:
        required: true
      ts_authkey:
        required: true
      gh_api_token:
        required: true
      test_mode:
        type: boolean
        default: false
      runtime_minutes:
        required: false
        default: "355"
      loops:
        required: false
        default: "0"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve inputs (safe)
        id: cfg
        env:
          RAW_TAILNET:  ${{ inputs.ts_tailnet }}
          RAW_APIKEY:   ${{ inputs.ts_api_key }}
          RAW_AUTHKEY:  ${{ inputs.ts_authkey }}
          RAW_PAT:      ${{ inputs.gh_api_token }}
          RAW_TEST:     ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME:  ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:    ${{ inputs.loops || '0' }}
        run: |
          function ToIntOr($v,$d){ if("$v" -match '^\d+$'){[int]$v}else{[int]$d} }
          $tailnet=$env:RAW_TAILNET; $apiKey=$env:RAW_APIKEY; $authKey=$env:RAW_AUTHKEY; $pat=$env:RAW_PAT
          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) { Write-Error "Missing inputs"; exit 1 }
          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }
          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }
          "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT

      - name: ⚙️ Install Tailscale
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $dst="$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: 🔐 Enable RDP user + firewall
        run: |
          $u="${{ env.RDP_USER }}"; $p="${{ env.RDP_PASS }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: 🧹 PURGE bullet (startup)
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          try {
            $resp = Invoke-RestMethod -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')) {
                try { Invoke-RestMethod -Method DELETE -Headers $hdr -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" | Out-Null; Write-Host "Deleted: $($d.name)" } catch {}
              }
            }
          } catch { Write-Warning "Startup purge failed: $_" }

      - name: 🔗 Tailscale up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 2
          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          $status = & $ts status --json | ConvertFrom-Json
          "### RDP via Tailscale`nIPv4: $ip4`nMagicDNS: $($status.Self.DNSName)`nUser: $env:RDP_USER`nPass: $env:RDP_PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ⬇️⬇️ NEW: Public tunnel + keep alive (replaces old "Keep alive") ⬇️⬇️
      - name: 🌐 Public RDP via pinggy tunnel + keep alive
        run: |
          # Show runner's public IP (for reference — inbound blocked by GitHub)
          try { $pub = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing -TimeoutSec 10).Content.Trim() }
          catch { $pub = "unknown" }
          Write-Host "Runner public IP: $pub (GitHub blocks inbound RDP — using tunnel)"

          $ssh = "$env:WINDIR\System32\OpenSSH\ssh.exe"
          if (-not (Test-Path $ssh)) { $ssh = "ssh" }
          $log = "$env:TEMP\pinggy.out"; $err = "$env:TEMP\pinggy.err"

          # Start (and auto-restart on failure) pinggy TCP tunnel for RDP 3389
          function Start-Tunnel {
            Remove-Item $log,$err -ErrorAction SilentlyContinue
            Start-Process -FilePath $ssh -ArgumentList @(
              '-p','443','-R0:localhost:3389',
              '-o','StrictHostKeyChecking=no',
              '-o','ServerAliveInterval=30',
              '-o','ExitOnForwardFailure=yes',
              'tcp@a.pinggy.io'
            ) -PassThru -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow
          }
          $tunnel = Start-Tunnel
          Start-Sleep -Seconds 15

          $content = ""
          if (Test-Path $log) { $content += (Get-Content $log -Raw -ErrorAction SilentlyContinue) }
          if (Test-Path $err) { $content += "`n" + (Get-Content $err -Raw -ErrorAction SilentlyContinue) }
          $content | Write-Host
          $m = [regex]::Match($content, 'tcp://([a-zA-Z0-9\.\-]+):(\d+)')
          if ($m.Success) {
            $tcpHost = $m.Groups[1].Value; $tcpPort = $m.Groups[2].Value
            Write-Host "Tunnel: tcp://${tcpHost}:${tcpPort}"
            "### 🎯 RDP via PUBLIC endpoint`n**Endpoint:** ``${tcpHost}:${tcpPort}``\n**User:** ``$env:RDP_USER```\n**Pass:** ``$env:RDP_PASS```\n\nConnect: mstsc → ``${tcpHost}:${tcpPort}``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Warning "Could not parse tunnel URL — pinggy may be down"
          }

          # Keep alive loop with tunnel auto-restart
          $mins=[int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins)
          $lastRestart = Get-Date
          while((Get-Date) -lt $end){
            if ($tunnel.HasExited -and ((Get-Date)-$lastRestart).TotalSeconds -gt 30) {
              Write-Warning "Tunnel died — restarting (endpoint will change!)"
              $tunnel = Start-Tunnel
              $lastRestart = Get-Date
              Start-Sleep -Seconds 12
              $content = ""
              if (Test-Path $log) { $content += (Get-Content $log -Raw -ErrorAction SilentlyContinue) }
              if (Test-Path $err) { $content += "`n" + (Get-Content $err -Raw -ErrorAction SilentlyContinue) }
              $m = [regex]::Match($content, 'tcp://([a-zA-Z0-9\.\-]+):(\d+)')
              if ($m.Success) {
                "### 🔁 Tunnel restarted — NEW endpoint`n``$($m.Groups[1].Value):$($m.Groups[2].Value)``\nUser: ``$env:RDP_USER`` / Pass: ``$env:RDP_PASS``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
            }
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            Write-Host "RDP alive... ($left min left) — tunnel: $(if($tunnel.HasExited){'DOWN'}else{'UP'})"
            Start-Sleep -Seconds 60
          }
          try { Stop-Process -Id $tunnel.Id -Force -ErrorAction SilentlyContinue } catch {}

      - name: 🧹 PURGE bullet (exit)
        if: always()
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          try {
            $resp = Invoke-RestMethod -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')) {
                try { Invoke-RestMethod -Method DELETE -Headers $hdr -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" | Out-Null; Write-Host "Deleted: $($d.name)" } catch {}
              }
            }
          } catch { Write-Warning "Exit purge failed: $_" }

      - name: 🔁 Dispatch workflow B
        if: always()
        run: |
          $loops=[int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "Loops finished"; exit 0 }
          if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }
          $token="${{ steps.cfg.outputs.pat }}"
          $body=@{ ref="${{ github.ref_name }}"; inputs=@{
            ts_tailnet="${{ steps.cfg.outputs.tailnet }}"; ts_api_key="${{ steps.cfg.outputs.apikey }}";
            ts_authkey="${{ steps.cfg.outputs.authkey }}"; gh_api_token="$token";
            test_mode="false"; runtime_minutes="${{ steps.cfg.outputs.runtime }}"; loops="$next"
          }} | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-B.yml/dispatches" `
            -Headers @{ Authorization="Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
