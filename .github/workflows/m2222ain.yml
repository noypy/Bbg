name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale auth key (reusable or ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub Personal Access Token (classic; scopes: repo, workflow)"
        required: true
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve inputs (safe)
        id: cfg
        env:
          RAW_TAILNET:  ${{ inputs.ts_tailnet }}
          RAW_APIKEY:   ${{ inputs.ts_api_key }}
          RAW_AUTHKEY:  ${{ inputs.ts_authkey }}
          RAW_PAT:      ${{ inputs.gh_api_token }}
          RAW_TEST:     ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME:  ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:    ${{ inputs.loops || '0' }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }
          $tailnet = $env:RAW_TAILNET
          $apiKey  = $env:RAW_APIKEY
          $authKey = $env:RAW_AUTHKEY
          $pat     = $env:RAW_PAT
          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) { Write-Error "Missing required inputs"; exit 1 }
          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }
          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }
          "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Resolved: test=$isTest, runtime=$runtime, loops=$loops"

      - name: ⚙️ Install Tailscale (if missing)
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: 🔐 Enable RDP user + firewall
        run: |
          $u="${{ env.RDP_USER }}"; $p="${{ env.RDP_PASS }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: 🌍 Public IP (info only)
        id: pubip
        run: |
          $ip = $null
          try { $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json" -TimeoutSec 10).ip } catch {}
          if (-not $ip) { try { $ip = (Invoke-RestMethod -Uri "https://ifconfig.me/ip" -TimeoutSec 10) } catch {} }
          if (-not $ip) { $ip = "unknown" }
          Write-Host "Public IP: $ip"
          "ip=$ip" | Out-File -Append $env:GITHUB_OUTPUT
          @"
          ### 🌍 Runner Public IP
          **IP:** ``$ip``
          > ⚠️ Inbound 3389 blocked — use the Pinggy endpoint below.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ═══════════════════════════════════════════════════════════════
      # 🌐 Pinggy SSH tunnel (no download, auto-restart every 55 min)
      # ═══════════════════════════════════════════════════════════════
      - name: 🌐 Pinggy SSH tunnel (RDP 3389)
        id: tunnel
        run: |
          $so = "$env:TEMP\pinggy.out"; $se = "$env:TEMP\pinggy.err"
          $endpoint = $null
          $proc = $null
          $startTime = Get-Date

          function Start-Pinggy {
            param($outFile, $errFile)
            Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
            $sshArgs = @(
              '-p','443',
              '-o','StrictHostKeyChecking=no',
              '-o',"UserKnownHostsFile=$env:TEMP\known_hosts",
              '-o','ServerAliveInterval=30',
              '-o','ServerAliveCountMax=3',
              '-o','ExitOnForwardFailure=yes',
              '-R','0:127.0.0.1:3389',
              'tcp@free.pinggy.io'
            )
            return Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile `
              -PassThru -WindowStyle Hidden
          }

          $proc = Start-Pinggy -outFile $so -errFile $se
          Write-Host "Pinggy PID: $($proc.Id) — waiting for endpoint..."

          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not $endpoint) {
            Start-Sleep -Seconds 3
            foreach ($f in @($so,$se)) {
              if (Test-Path $f) {
                $c = Get-Content $f -Raw -ErrorAction SilentlyContinue
                if ($c -match 'tcp://([^\s]+:\d+)') { $endpoint = $Matches[1] }
                if ($endpoint) { break }
              }
            }
          }

          if (-not $endpoint) {
            Write-Host "--- pinggy stderr ---"; Get-Content $se -ErrorAction SilentlyContinue | Write-Host
            throw "Pinggy did not return endpoint"
          }

          "endpoint=$endpoint"   | Out-File -Append $env:GITHUB_OUTPUT
          "tunnel_pid=$($proc.Id)" | Out-File -Append $env:GITHUB_OUTPUT
          "tunnel_start=$($startTime.ToString('o'))" | Out-File -Append $env:GITHUB_OUTPUT

          @"
          ### 🌐 Public RDP (Pinggy — no Tailscale client needed)
          **Endpoint:** ``$endpoint``  → mstsc Computer = ``$endpoint``
          **User:** ``$env:RDP_USER``
          **Pass:** ``$env:RDP_PASS``

          > Free tier timeout ≈ 60 min — auto-restart loop will renew the endpoint.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 🧹 PURGE devices containing 'bullet' (startup)
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d)
            ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
          }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try { Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null; Write-Host "Deleted: $($d.name)" } catch {}
              }
            }
          } catch { Write-Warning "Startup purge failed: $_" }

      - name: 🔗 Tailscale up (hostname=bullet)
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 2
          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          $status = & $ts status --json | ConvertFrom-Json
          $fqdn = $status.Self.DNSName
          "ip4=$ip4" | Out-File -Append $env:GITHUB_OUTPUT
          "fqdn=$fqdn" | Out-File -Append $env:GITHUB_OUTPUT
          @"
          ### 🔒 Tailscale RDP
          **Host:** ``$env:TS_HOSTNAME``  **IPv4:** ``$ip4``  **MagicDNS:** ``$fqdn``
          **User:** ``$env:RDP_USER``  **Pass:** ``$env:RDP_PASS``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Keep alive (with Pinggy auto-restart)
        run: |
          $mins=[int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins)
          $tpid = "${{ steps.tunnel.outputs.tunnel_pid }}"
          $currentEndpoint = "${{ steps.tunnel.outputs.endpoint }}"
          $lastRestart = Get-Date

          while((Get-Date) -lt $end){
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            $proc = Get-Process -Id $tpid -ErrorAction SilentlyContinue

            if (-not $proc) {
              Write-Warning "Pinggy process died — restarting..."
              $so = "$env:TEMP\pinggy.out"; $se = "$env:TEMP\pinggy.err"
              Remove-Item $so,$se -ErrorAction SilentlyContinue
              $sshArgs = @('-p','443','-o','StrictHostKeyChecking=no','-o',"UserKnownHostsFile=$env:TEMP\known_hosts",'-o','ServerAliveInterval=30','-o','ServerAliveCountMax=3','-o','ExitOnForwardFailure=yes','-R','0:127.0.0.1:3389','tcp@free.pinggy.io')
              $newProc = Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs -RedirectStandardOutput $so -RedirectStandardError $se -PassThru -WindowStyle Hidden
              $tpid = $newProc.Id
              Start-Sleep -Seconds 10
              $newEndpoint = $null
              foreach ($f in @($so,$se)) {
                if (Test-Path $f) {
                  $c = Get-Content $f -Raw -ErrorAction SilentlyContinue
                  if ($c -match 'tcp://([^\s]+:\d+)') { $newEndpoint = $Matches[1] }
                }
              }
              if ($newEndpoint) {
                $currentEndpoint = $newEndpoint
                Write-Host "New Pinggy endpoint: $currentEndpoint"
                @"
                ### 🔄 Pinggy restarted
                **New endpoint:** ``$currentEndpoint``
                **User:** ``$env:RDP_USER``  **Pass:** ``$env:RDP_PASS``
                "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
            }

            # Pinggy free tier 60-min timeout — proactively restart every 55 min
            if (((Get-Date) - $lastRestart).TotalMinutes -ge 55) {
              Write-Host "Pinggy 55-min rotation — restarting..."
              Stop-Process -Id $tpid -Force -ErrorAction SilentlyContinue
              $lastRestart = Get-Date
              continue
            }

            Write-Host "alive... $left min | endpoint: $currentEndpoint | pid: $tpid"
            Start-Sleep -Seconds 60
          }

      - name: 🧹 PURGE devices containing 'bullet' (exit)
        if: always()
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d)
            ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
          }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try { Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null; Write-Host "Deleted: $($d.name)" } catch {}
              }
            }
          } catch { Write-Warning "Exit purge failed: $_" }

      - name: 🛑 Kill tunnel
        if: always()
        run: |
          $tpid = "${{ steps.tunnel.outputs.tunnel_pid }}"
          if ($tpid -and $tpid -ne '') { Stop-Process -Id $tpid -Force -ErrorAction SilentlyContinue }
          Get-Process ssh -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: 🔁 Dispatch workflow B
        if: always()
        run: |
          $loops=[int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "Loops finished."; exit 0 }
          if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }
          $token="${{ steps.cfg.outputs.pat }}"
          $body=@{
            ref    = "${{ github.ref_name }}"
            inputs = @{
              ts_tailnet      = "${{ steps.cfg.outputs.tailnet }}"
              ts_api_key      = "${{ steps.cfg.outputs.apikey }}"
              ts_authkey      = "${{ steps.cfg.outputs.authkey }}"
              gh_api_token    = "$token"
              test_mode       = "false"
              runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
              loops           = "$next"
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-B.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
